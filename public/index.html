<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omni Video — Gemini Omni 1.1 Flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF5; --panel:#F8FAFD; --ink:#0E1330; --mute:#5B6385; --line:#C9D0E2;
  --blue:#2535F5; --blue-d:#1A27C4; --err:#B3261E;
  --head:'Bricolage Grotesque','Segoe UI',sans-serif; --body:'Hanken Grotesk','Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B0F24;--panel:#131939;--ink:#EDF0FF;--mute:#8F98C4;--line:#262E5C;--blue:#5B6BFF;--blue-d:#7C89FF;--err:#FF8A80}
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:1080px;margin:0 auto;padding:40px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px}
@media(max-width:820px){main{grid-template-columns:1fr;padding-top:24px}}
h1{font:800 clamp(40px,7vw,76px)/.92 var(--head);letter-spacing:-.03em;grid-column:1/-1}
h1 small{display:block;font:500 16px/1.4 var(--body);letter-spacing:0;color:var(--mute);margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
label span{color:var(--mute);font-weight:400}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:700 16px var(--head);background:var(--blue);color:#fff;border:0;border-radius:8px;padding:14px 18px;cursor:pointer}
button:hover{background:var(--blue-d)}
button:disabled{opacity:.5;cursor:wait}
.stage{aspect-ratio:16/9;background:#05071A;border-radius:10px;display:grid;place-items:center;overflow:hidden;color:#8F98C4;text-align:center;padding:16px}
.stage video{width:100%;height:100%;object-fit:contain}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:35%;background:var(--blue);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.status{font-size:14px;color:var(--mute);min-height:21px}
.status.err{color:var(--err)}
.status a{color:var(--blue);font-weight:600}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.hist button{all:unset;cursor:pointer;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#05071A;border:1px solid var(--line)}
.hist video{width:100%;height:100%;object-fit:cover;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>Omni Video<small>Text and images to video with Gemini Omni 1.1 Flash.</small></h1>

  <section class="panel">
    <label>Prompt
      <textarea id="prompt" placeholder="A slow push-in on a neon-lit street at night, rain on the pavement, a figure walking toward the camera."></textarea>
    </label>
    <div class="row">
      <label>Duration
        <select id="duration">
          <option>3</option><option selected>4</option><option>6</option><option>8</option><option>10</option>
        </select>
      </label>
      <label>First frame URL <span>optional</span>
        <input id="first" type="url" placeholder="https://…/frame.png">
      </label>
    </div>
    <label>Reference image URLs <span>optional, one per line, up to 7</span>
      <textarea id="imgs" style="min-height:70px" placeholder="https://…/ref1.png"></textarea>
    </label>
    <button id="go">Generate video</button>
  </section>

  <section class="panel">
    <div class="stage" id="stage">Your video appears here.</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status"></div>
    <div class="hist" id="hist"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), statusEl = $('status'), bar = $('bar'), go = $('go');
let history = [];
try { history = JSON.parse(localStorage.getItem('omni-history') || '[]'); } catch {}

const setStatus = (t, err) => { statusEl.textContent = t; statusEl.className = 'status' + (err ? ' err' : ''); };

function show(url) {
  stage.innerHTML = '';
  const v = document.createElement('video');
  v.src = url; v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
  stage.appendChild(v);
  statusEl.className = 'status';
  statusEl.innerHTML = `Done. <a href="${url}" download target="_blank" rel="noopener">Download video</a>`;
}

function renderHist() {
  const h = $('hist'); h.innerHTML = '';
  history.forEach(url => {
    const b = document.createElement('button');
    b.innerHTML = `<video src="${url}" muted preload="metadata"></video>`;
    b.onclick = () => show(url);
    h.appendChild(b);
  });
}
renderHist();

const sleep = ms => new Promise(r => setTimeout(r, ms));

go.onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return setStatus('Enter a prompt first.', true);
  const imageUrls = $('imgs').value.split('\n').map(s => s.trim()).filter(Boolean);

  go.disabled = true; bar.style.display = 'block';
  stage.textContent = 'Generating…';
  setStatus('Submitting…');

  try {
    const r = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, duration: $('duration').value, imageUrls, firstFrameUrl: $('first').value.trim() })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Request failed');

    const t0 = Date.now();
    while (true) {
      await sleep(4000);
      const s = await (await fetch('/api/status?id=' + j.taskId)).json();
      if (s.error && !s.state) throw new Error(s.error);
      if (s.state === 'success' && s.videoUrl) {
        history.unshift(s.videoUrl); history = history.slice(0, 12);
        try { localStorage.setItem('omni-history', JSON.stringify(history)); } catch {}
        renderHist(); show(s.videoUrl); break;
      }
      if (s.state === 'fail') throw new Error(s.error || 'Generation failed');
      setStatus(`Rendering… ${Math.round((Date.now() - t0) / 1000)}s`);
      if (Date.now() - t0 > 600000) throw new Error('Timed out after 10 minutes.');
    }
  } catch (e) {
    stage.textContent = 'No video.';
    setStatus(e.message, true);
  } finally {
    go.disabled = false; bar.style.display = 'none';
  }
};
</script>
</body>
</html>
